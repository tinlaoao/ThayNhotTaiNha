name: Build iOS IPA Unsigned

on:
  workflow_dispatch: # Giữ nguyên nút bấm chạy thủ công trên GitHub

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Prebuild Native iOS Project
        # Bước này sẽ tự động tạo thư mục 'ios' và chạy 'pod install'
        run: npx expo prebuild --platform ios --clean

      - name: Build App (Unsigned)
        run: |
          cd ios
          
          # Tự động trích xuất tên Workspace và Scheme do Expo sinh ra
          WORKSPACE_NAME=$(ls | grep .xcworkspace | head -1)
          SCHEME_NAME=$(ls | grep .xcodeproj | sed 's/\.xcodeproj//' | head -1)
          
          echo "Đang build Workspace: $WORKSPACE_NAME với Scheme: $SCHEME_NAME"
          
          # Lệnh build ép buộc bỏ qua chữ ký
          xcodebuild -workspace "$WORKSPACE_NAME" \
                     -scheme "$SCHEME_NAME" \
                     -sdk iphoneos \
                     -configuration Release \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     CODE_SIGN_STYLE=Manual \
                     build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          
          # Tìm thư mục .app vừa được Xcode build ra
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Lỗi: Không tìm thấy file .app sau khi build!"
            exit 1
          fi
          
          # Copy .app vào thư mục Payload
          cp -r "$APP_PATH" Payload/
          
          # Nén thành tệp .ipa (Tên file xuất ra sẽ là app-unsigned.ipa)
          zip -r app-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unsigned-iOS-App
          path: app-unsigned.ipa