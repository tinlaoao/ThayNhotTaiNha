name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Prebuild Native iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Decode Certificates
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p certs
          echo "$P12_BASE64" | tr -d '\n\r ' | base64 --decode > certs/certificate.p12
          echo "$PROFILE_BASE64" | tr -d '\n\r ' | base64 --decode > certs/profile.mobileprovision

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp certs/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

          security create-keychain -p "temp_pass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp_pass" build.keychain
          
          security import certs/certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -f pkcs12 -A
          security set-keychain-settings -lut 21600 build.keychain

      - name: Build and Export IPA
        run: |
          cd ios
          pod install
          
          # Tự động trích xuất UUID và Tên Profile từ tệp mobileprovision hệ thống
          PROV_PROFILE_FILE="$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
          UUID=$(grep -a -A 1 '<key>UUID</key>' "$PROV_PROFILE_FILE" | grep -oE '<string>.*</string>' | head -n 1 | tr -d '<>/string')
          PROFILE_NAME=$(grep -a -A 1 '<key>Name</key>' "$PROV_PROFILE_FILE" | grep -oE '<string>.*</string>' | head -n 1 | tr -d '<>/string')
          
          echo "Da tim thay Profile UUID: $UUID"
          echo "Da tim thay Profile Name: $PROFILE_NAME"

          # Build Archive với thông tin xác thực được trích xuất động
          xcodebuild -workspace ThayNhotTaiNha.xcworkspace \
            -scheme ThayNhotTaiNha \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ThayNhotTaiNha.xcarchive \
            archive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="$UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          # Xuất bản gói IPA
          xcodebuild -exportArchive \
            -archivePath build/ThayNhotTaiNha.xcarchive \
            -exportOptionsPlist ../exportOptions.plist \
            -exportPath build/output

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThayNhotTaiNha-IPA
          path: ios/build/output/*.ipa